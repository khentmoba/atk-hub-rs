[package]
name = "atk-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "THX audio gRPC client for the ATK HUB Rust port"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.13", features = ["tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }

[build-dependencies]
tonic-build = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net"] }
tokio-stream = "0.1"

[lints]
workspace = true
