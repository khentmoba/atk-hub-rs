[package]
name = "atk-input"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe wrappers for macro key injection and Windows system settings"

[dependencies]
thiserror.workspace = true
serde.workspace = true
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[lints.rust]
# FFI to user32 is required for the documented macro injection feature.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
