<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ATK HUB Notification</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .toast {
      box-sizing: border-box;
      width: calc(100% - 16px);
      margin: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(20, 21, 26, 0.94);
      border: 1px solid rgba(255, 105, 0, 0.45);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      color: #f4f5f7;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ff6900;
      margin-bottom: 4px;
    }
    .body {
      font-size: 12px;
      color: #d4d7df;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="toast">
    <div class="title" id="t-title">ATK HUB</div>
    <div class="body" id="t-body"></div>
  </div>
  <script>
    let timer = null;
    const hide = () => window.__TAURI__?.core?.invoke("toast_hide").catch(() => {});
    window.__TAURI__?.event?.listen("notification:show", ({ payload }) => {
      document.getElementById("t-title").textContent = payload?.title || "ATK HUB";
      document.getElementById("t-body").textContent = payload?.body || "";
      clearTimeout(timer);
      timer = setTimeout(hide, Math.max(1500, Number(payload?.durationMs) || 3500));
    });
  </script>
</body>
</html>
