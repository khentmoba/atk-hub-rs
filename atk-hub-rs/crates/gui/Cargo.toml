[package]
name = "atk-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri desktop shell for the ATK HUB Rust port"

[lib]
name = "atk_gui"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atk-hub-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
atk-agent.workspace = true
atk-asar.workspace = true
atk-config.workspace = true
atk-endpoints.workspace = true
atk-ipc.workspace = true
atk-wallpaper.workspace = true
atk-audio.workspace = true
atk-features.workspace = true
atk-input.workspace = true
atk-hid.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

[lints]
workspace = true
